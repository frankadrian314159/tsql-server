[package]
name = "tsql-server"
version = "0.1.0"
edition = "2021"
description = "An in-memory clone of Microsoft SQL Server with a T-SQL engine"
license = "MIT"

[lib]
name = "tsql_server"
path = "src/lib.rs"

[[bin]]
name = "tsql"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", features = ["alloc"] }
crc32fast = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
