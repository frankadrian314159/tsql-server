[package]
name = "tsql-raft"
version = "0.1.0"
edition = "2021"
description = "A small Raft consensus core (leader election, log replication, commit) with a file-backed log, for replicated shards"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
crc32fast = "1"
